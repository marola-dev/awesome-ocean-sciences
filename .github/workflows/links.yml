name: Check links

on:
  push:
    branches: [main]
  pull_request:

jobs:
  awesome-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: gem install awesome_bot
      # Instagram and doi.org block bots; the rest must resolve.
      - run: awesome_bot --skip-save-results README.md --allow-redirect --allow 429,503 --white-list instagram.com,doi.org
